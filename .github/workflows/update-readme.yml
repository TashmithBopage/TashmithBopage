name: Update README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Update repo count and followers
        run: |
          API=$(curl -s "https://api.github.com/users/TashmithBopage")
          REPO_COUNT=$(echo $API | python3 -c "import sys,json; print(json.load(sys.stdin)['public_repos'])")
          FOLLOWERS=$(echo $API | python3 -c "import sys,json; print(json.load(sys.stdin)['followers'])")
          sed -i "s/public_repos-[0-9]*/public_repos-${REPO_COUNT}/" README.md
          sed -i "s/followers-[0-9]*/followers-${FOLLOWERS}/" README.md
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || git commit -m "Auto update stats [skip ci]"
          git push
